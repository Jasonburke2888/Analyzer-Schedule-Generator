# Deploy repository root to GitHub Pages (static app at site root).
# Coworkers use the Pages URL only — no Python or local server required.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site bundle
        run: |
          mkdir -p _site
          cp index.html import.html standalone.html .nojekyll _site/
          cp -r css js data app _site/
          test -f _site/css/styles.css
          test -f _site/css/import-wizard.css
          test -f _site/js/app.js
          test -f _site/import.html
          test -f _site/data/activities.csv
          test -f _site/data/fixtures/1830-pse-sample.xlsx
          test -f _site/standalone.html
          test -f _site/app/shared/standard-import-schema.js
          test -f _site/app/shared/excel-reader.js
          test -f _site/app/estimate-import/template-detector.js
          test -f _site/app/estimate-import/import-wizard.js
          test -f _site/app/estimate-import/eichleay-pse-old-parser.js
          test -f _site/app/database/schema.js
          test -f _site/app/database/project-db.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
